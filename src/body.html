<div class="app">
  <header class="hud">
    <div class="brand"><img alt="랜덤 히어로 디펜스" src="ui/logo_horizontal.png"></div>
    <div class="res life" title="목숨"><img alt="" src="ui/nav/ic_life.webp"><b id="sLife">30</b><span class="sr">목숨</span></div>
    <div class="res ore" title="골드"><img alt="" src="ui/nav/ic_gold.webp"><b id="sOre">0</b><span class="sr">골드</span></div>
    <div class="res gas" title="보석"><img alt="" src="ui/nav/ic_gem.webp"><b id="sGas">0</b><span class="sr">보석</span></div>
    <b id="sKill" hidden>0</b>
  </header>

  <main class="board">
   <div class="stage">
    <div class="speed ctl" role="group" aria-label="게임 속도">
      <button id="spP" type="button" aria-pressed="false" aria-label="일시정지"></button>
      <button id="spX" type="button" aria-label="배속 바꾸기">x1</button>
    </div>
    <button type="button" id="skipBtn" class="skip" hidden>바로 시작 <span id="sTimer">--</span></button>
    <div class="vp" id="vp"><canvas id="cv" width="990" height="870" aria-label="전장"></canvas></div>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="bubble" id="bubble" hidden></div>
    <button type="button" class="lotto summonBtn" id="summonBtn" aria-label="소환, 골드 100"><b>소환</b><span>골드 100</span></button>
    <button type="button" class="lotto" id="lottoBtn" aria-label="복권, 골드 100"><b>복권</b><span>골드 100</span></button>
    <button type="button" class="mergeAll" id="mergeAll" disabled aria-label="합성"><b>합성</b><span id="mergeAllN">0</span></button>
    <div class="overlay" id="rewardOv" hidden><div class="box" id="rewardBox"></div></div>
    <div class="homeOv" id="startOv">
      <img class="homeLogo" alt="랜덤 히어로 디펜스" src="ui/logo_vertical.png">
      <div class="homeLow">
        <div class="recPlate"><span id="homeBest">아직 기록이 없어요</span></div>
        <button type="button" class="imgBtn startBtn" id="dNormal" data-d="normal" aria-label="게임 시작"><img alt="" src="ui/home/btn_start.png"></button>
        <div class="homeBtns">
          <button type="button" class="imgBtn" id="homeCodex" aria-label="도감"><img alt="" src="ui/home/btn_codex.png"></button>
          <button type="button" class="imgBtn" id="homeHelp" aria-label="게임 방법"><img alt="" src="ui/home/btn_help.png"></button>
          <button type="button" class="imgBtn" id="homeSnd" aria-label="소리 끄기"><img alt="" id="homeSndImg" src="ui/home/btn_sound_on.png"></button>
        </div>
      </div>
      <div class="homeModal" id="helpModal" hidden><div class="hm"><h2>게임 방법</h2>
        <ol class="steps">
          <li><img alt="" src="ui/icons/icon_guide_draw.svg">소환을 누르거나 빈 칸을 눌러 캐릭터 뽑기</li>
          <li><img alt="" src="ui/icons/icon_guide_merge.svg">같은 캐릭터 2명을 합성</li>
          <li><img alt="" src="ui/icons/icon_guide_survive.svg">최대한 오래 버티기 (200웨이브 뒤 무한 모드)</li>
          <li><img alt="" src="ui/aug/icons/pure.png">5·15·25…웨이브에 증강 1개 고르기</li>
        </ol><button type="button" class="btn" id="tipReset">게임 중 도움말 다시 보기</button><button type="button" class="btn primary" data-close>닫기</button></div></div>
      <div class="homeModal" id="codexModal" hidden><div class="hm wide"><h2>도감</h2><div id="codexSlot"></div><button type="button" class="btn primary" data-close>닫기</button></div></div>
    </div>
    <div class="overlay" id="endOv" hidden>
      <div class="result">
        <img class="resBanner" id="resBanner" alt="기록" src="ui/result/banner_record.png">
        <div class="resPanel">
          <div class="rz wave"><b id="resWave">0</b><small>웨이브</small></div>
          <div class="rz best" id="resBest">최고 기록 0 웨이브</div>
          <div class="rz augs" id="resAugs"></div>
          <div class="rz hero" id="resHero"></div>
        </div>
        <button type="button" class="imgBtn retryBtn" id="restart" aria-label="다시 하기"><img alt="" src="ui/result/btn_retry.png"></button>
        <button type="button" class="imgBtn homeBtn" id="goHome" aria-label="홈으로"><img alt="" src="ui/result/btn_home.png"></button>
        <span id="endTitle" hidden></span><p id="endText" hidden></p>
      </div>
    </div>
   </div>
    <div class="log" id="log" aria-live="polite"></div>
  </main>

  <aside class="rail" id="rail" data-view="pUpg">
    <div class="sheetHead"><b id="sheetTitle">업그레이드</b><button type="button" id="sheetClose">닫기</button></div>
    <section class="card" id="selCard">
      <h3>선택</h3>
      <div id="selBody"><p class="hint">빈 발판을 누르면 타워를 짓습니다. 타워를 누르면 합성·판매할 수 있습니다.</p></div>
    </section>
    <section class="card" id="tabCard">
      <h3>업그레이드</h3>
      <div id="pUpg"></div>
      <div id="pMis" hidden></div>
    </section>
    <section class="card" id="codexCard">
      <h3>도감</h3>
      <div id="augPart">
        <p class="cxH">내 증강</p><div id="augBody"></div>
        <details class="augAll"><summary>전체 증강 보기</summary><div id="augAll"></div></details>
      </div>
      <p class="cxH">캐릭터</p>
      <div class="codex" id="codex"></div>
      <div id="lottoOdds"></div>
    </section>
  </aside>
</div>
<nav class="mnav" aria-label="메뉴">
  <div class="mains">
    <button type="button" class="mbtn summon" id="navSummon" aria-label="소환, 골드 100"><img alt="" src="ui/nav/ic_summon.webp"><span><b>소환</b><small>골드 100</small></span></button>
    <button type="button" class="mbtn lottoM" id="navLotto" aria-label="복권, 골드 100"><img alt="" src="ui/nav/ic_lotto.webp"><span><b>복권</b><small>골드 100</small></span><i class="tagFree" id="navFree" hidden>무료</i></button>
  </div>
  <button type="button" class="sub" data-sheet="pUpg" aria-pressed="false"><img alt="" src="ui/nav/ic_upg.webp">업글</button>
  <button type="button" class="sub" id="navMerge" aria-label="합성"><img alt="" src="ui/nav/ic_merge.webp">합성<span class="dot" id="navMergeN" hidden>0</span></button>
  <button type="button" class="sub" data-sheet="codex" aria-pressed="false"><img alt="" src="ui/nav/ic_codex.webp">도감</button>
</nav>
